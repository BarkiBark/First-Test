<title>מאפיית השברים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a game shell. Sticky HUD (home, coins, sound); a station map as home; each station is a chocolate "tray" stage, a mascot who talks, and chunky toy-like answer bubbles. */
:root{
  --bg:#E8EEFF; --bg2:#F5F0FF; --surface:#FFFFFF; --ink:#24204A; --muted:#67658C; --line:#DCDDF2;
  --btn:#2A2560; --btn-ink:#FFFFFF; --btn-deep:#120F33;
  --tray:#F4F6FF; --tray-dot:#DFE4FA; --foil:#E3E6F3; --foil-edge:#C3C9E0; --cut:#F4F6FF;
  --choc:#7B4529; --choc-hi:#A0623D; --straw:#EE6E9F; --straw-hi:#F7A1C2; --x:#E5484D;
  --butter:#FFC83D; --butter-deep:#D99A00; --mint:#16A982; --mint-soft:#D5F5EB; --coral:#F0574A; --coral-soft:#FFE2DE; --tip-soft:#EEEAFF;
  --c1:#C7F1E1; --c2:#E2D9FF; --c3:#FFDCC7; --c4:#D3E6FF; --c5:#FFEFAF; --c6:#FFD3E3;
  --shadow:0 10px 30px rgba(40,30,110,.10);
  --focus:#4C6BFF;
  --font-display:"Fredoka","Assistant","Arial Hebrew",system-ui,sans-serif;
  --font-body:"Assistant","Arial Hebrew","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13122E; --bg2:#1B1440; --surface:#211F4A; --ink:#F3F1FF; --muted:#A6A3CC; --line:#35336A;
  --btn:#9D8CFF; --btn-ink:#130F33; --btn-deep:#5E4CD6;
  --tray:#1A1940; --tray-dot:#26245A; --foil:#2D2B5E; --foil-edge:#45437F; --cut:#1A1940;
  --choc:#8A5233; --choc-hi:#B27148; --straw:#F07FAB; --straw-hi:#F7A9C8; --x:#FF6B70;
  --butter:#FFCF52; --butter-deep:#C98F00; --mint:#3DD6AA; --mint-soft:#163D36; --coral:#FF7A6E; --coral-soft:#45222A; --tip-soft:#2B2860;
  --c1:#183F38; --c2:#2E2862; --c3:#45302A; --c4:#1E3155; --c5:#40391C; --c6:#4A2340;
  --shadow:0 10px 30px rgba(0,0,0,.35); --focus:#9DB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13122E; --bg2:#1B1440; --surface:#211F4A; --ink:#F3F1FF; --muted:#A6A3CC; --line:#35336A;
  --btn:#9D8CFF; --btn-ink:#130F33; --btn-deep:#5E4CD6;
  --tray:#1A1940; --tray-dot:#26245A; --foil:#2D2B5E; --foil-edge:#45437F; --cut:#1A1940;
  --choc:#8A5233; --choc-hi:#B27148; --straw:#F07FAB; --straw-hi:#F7A9C8; --x:#FF6B70;
  --butter:#FFCF52; --butter-deep:#C98F00; --mint:#3DD6AA; --mint-soft:#163D36; --coral:#FF7A6E; --coral-soft:#45222A; --tip-soft:#2B2860;
  --c1:#183F38; --c2:#2E2862; --c3:#45302A; --c4:#1E3155; --c5:#40391C; --c6:#4A2340;
  --shadow:0 10px 30px rgba(0,0,0,.35); --focus:#9DB0FF; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg2),var(--bg) 420px) var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;direction:rtl;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
b{font-weight:700}
mark{background:none;color:var(--straw);font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg2) 82%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.hud .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.home-link{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;border-radius:12px}
.home-link .kobi{width:40px;height:40px}
.home-link span{font:700 21px var(--font-display);letter-spacing:-.01em}
.stats{display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);box-shadow:0 2px 0 var(--line);font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.bump{animation:bump .35s var(--spring)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 2px 0 var(--line);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
@keyframes bump{50%{transform:scale(1.18)}}

main.wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:22px}

/* buttons */
.tbtn{font:600 18px var(--font-display);padding:12px 22px;border-radius:16px;border:0;background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-deep);cursor:pointer;transition:transform .12s,box-shadow .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--btn-deep)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.tbtn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.tbtn.sun{background:var(--butter);color:#3A2600;box-shadow:0 5px 0 var(--butter-deep)}
.tbtn.sm{font-size:16px;padding:9px 16px;border-radius:14px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:8px 0 4px}
.hero .kobi{width:150px;height:150px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
.hero h1{font:700 46px/1.05 var(--font-display);margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--choc)}
:root[data-theme="dark"] .hero h1 em{color:var(--choc-hi)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h1 em{color:var(--choc-hi)}}
.speech{position:relative;background:var(--surface);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);max-width:52ch;font-size:18px}
.speech::before{content:"";position:absolute;right:-9px;top:22px;border:10px solid transparent;border-left-color:var(--surface);border-right:0}
.hero .speech::before{top:auto;bottom:-9px;right:30px;border:10px solid transparent;border-top-color:var(--surface);border-bottom:0}
.hero .speech{margin-top:4px}

/* map */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sechead h2{font:700 26px var(--font-display);margin:0}
.sechead p{margin:0;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .band{height:112px;display:grid;place-items:center;position:relative}
.card .badge{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 18px var(--font-display)}
.card .stars{position:absolute;top:14px;left:12px;display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.card .body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font:700 21px var(--font-display)}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card.next-up{outline:3px solid var(--butter);outline-offset:-3px}
.card .nexttag{position:absolute;bottom:10px;left:12px;font:600 13px var(--font-display);background:var(--butter);color:#3A2600;padding:2px 10px;border-radius:999px}

/* mini static chocolate */
.mbar{display:inline-flex;gap:3px;height:34px;width:170px;max-width:100%;padding:4px;background:var(--surface);border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.mbar i{flex:1;border-radius:4px;background:var(--foil)}
.mbar i.a{background:var(--choc);box-shadow:inset 0 2px 0 var(--choc-hi),inset 0 -3px 0 rgba(0,0,0,.18)}
.mbar i.b{background:var(--straw);box-shadow:inset 0 2px 0 var(--straw-hi),inset 0 -3px 0 rgba(0,0,0,.12)}
.mbar.sm{height:24px;width:120px;padding:3px;gap:2px}
.artstack{display:flex;flex-direction:column;gap:8px;align-items:center}
.mgrid{display:grid;width:76px;height:76px;gap:3px;padding:4px;background:var(--surface);border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.mgrid i{background:var(--foil);border-radius:3px}
.mgrid i.a{background:var(--choc)}.mgrid i.b{background:var(--straw)}
.mgrid i.ab{background:repeating-linear-gradient(45deg,var(--choc) 0 5px,var(--straw) 5px 10px)}

/* station head */
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shead .ttl{display:flex;align-items:center;gap:12px}
.shead .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 24px var(--font-display)}
.shead h2{margin:0;font:700 30px/1.1 var(--font-display)}
.shead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.tabs{display:inline-flex;background:var(--surface);border-radius:16px;padding:5px;gap:4px;box-shadow:0 3px 0 var(--line)}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:12px;font:600 16px var(--font-display);cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.panel{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}

/* stage = chocolate tray */
.stage{position:relative;min-height:280px;padding:30px 26px;background-color:var(--tray);background-image:radial-gradient(var(--tray-dot) 1.6px,transparent 1.8px);background-size:20px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stage.mini{min-height:0;padding:22px 20px}
.bars{position:relative;width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
.brow{display:flex;align-items:center;gap:14px;transition:opacity .4s var(--ease),transform .6s var(--ease)}
.brow.enter{opacity:0;transform:translateY(12px) scale(.97)}
.brow.leave{opacity:0;pointer-events:none}
.brow.dim{opacity:.4}
.blabel{flex:none;width:76px;min-height:30px;display:flex;justify-content:center;align-items:center;font:600 24px var(--font-display);unicode-bidi:isolate}
.brow.sm .blabel{font-size:19px}
.blabel.roll{animation:roll .45s var(--ease)}
.brow.mark-bad .blabel{color:var(--x)}
.track{position:relative;flex:1;min-width:0;height:58px;background:var(--foil);border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.brow.sm .track{height:36px;border-radius:9px}
.track::after,.area::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--foil-edge);pointer-events:none;z-index:3}
.fill{position:absolute;top:0;bottom:0;transition:right .6s var(--ease),width .6s var(--ease),transform .75s var(--ease),opacity .35s;background-repeat:repeat-x}
.fill.s{border-top-right-radius:12px;border-bottom-right-radius:12px}
.fill.e{border-top-left-radius:12px;border-bottom-left-radius:12px}
.fill.a{background-color:var(--choc);background-image:linear-gradient(180deg,rgba(255,255,255,.20) 0 14%,transparent 14% 76%,rgba(0,0,0,.20) 76%),linear-gradient(90deg,rgba(0,0,0,.12) 0 9%,transparent 9% 91%,rgba(255,255,255,.12) 91%)}
.fill.b{background-color:var(--straw);background-image:linear-gradient(180deg,rgba(255,255,255,.28) 0 14%,transparent 14% 76%,rgba(0,0,0,.12) 76%),linear-gradient(90deg,rgba(0,0,0,.08) 0 9%,transparent 9% 91%,rgba(255,255,255,.15) 91%)}
.fill.x{background-color:var(--x)}
.fill.gone{opacity:0}
.cut{position:absolute;top:0;bottom:0;width:4px;margin-right:-2px;background:var(--cut);z-index:2;transition:transform .45s var(--spring),opacity .3s}
.hcut{position:absolute;left:0;right:0;height:4px;margin-top:-2px;background:var(--cut);z-index:2;transition:transform .45s var(--spring),opacity .3s}
.cut.in{transform:scaleY(0)}.hcut.in{transform:scaleX(0)}
.cut.gone,.hcut.gone{opacity:0}
.area{position:relative;width:min(260px,62vw);aspect-ratio:1;max-width:100%;background:var(--foil);border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.area>.colf,.area>.rowf,.area>.ovl{position:absolute;transition:width .6s var(--ease),height .6s var(--ease),opacity .5s}
.colf{top:0;right:0;bottom:0;width:0;background:var(--choc);border-radius:0 14px 14px 0}
.rowf{top:0;right:0;left:0;height:0;background:var(--straw);opacity:.6;border-radius:14px 14px 0 0}
.ovl{top:0;right:0;width:0;height:0;opacity:0;background:repeating-linear-gradient(45deg,var(--choc) 0 8px,var(--straw) 8px 16px);border-top-right-radius:14px;z-index:1}
.area.ov .colf{opacity:.4}
.area.ov .ovl{opacity:1}
.stage.still *{transition:none!important;animation:none!important}

/* math type */
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-family:var(--font-display);font-weight:600;unicode-bidi:isolate;direction:ltr}
.fr>span{padding:0 .2em;min-width:.9em;text-align:center}
.fr>.fd{border-top:.09em solid currentColor;padding-top:.04em}
.speech .fr,.prose .fr,.kb .fr,.qline .fr,.card .fr{font-size:.9em;margin:0 .1em}
.mx{display:inline-flex;align-items:center;gap:.08em;unicode-bidi:isolate;direction:ltr;font-family:var(--font-display);font-weight:600;vertical-align:middle}
.op{color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.kk{display:inline-flex;flex-direction:column;justify-content:space-between;height:2.3em;font-size:.55em;color:var(--straw);font-weight:700;margin-inline:-4px}
.m{unicode-bidi:isolate;direction:ltr;display:inline-block;font-family:var(--font-display);font-weight:600;white-space:nowrap}
.eqline{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:10px}
@keyframes roll{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.swap{animation:roll .45s var(--ease)}

/* lesson */
.eqtag{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:var(--surface);border-radius:18px;padding:8px 18px;box-shadow:var(--shadow);font:600 26px var(--font-display);min-height:56px;display:flex;align-items:center;white-space:nowrap;z-index:4}
.eqtag:empty{display:none}
.talk{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:44px 26px 8px}
.talk .kobi{width:72px;height:72px}
.talk .speech{max-width:none;box-shadow:none;background:var(--tip-soft)}
.talk .speech::before{border-left-color:var(--tip-soft)}
.talk .speech p{margin:0}
.ask{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ask .qline{font-weight:700}
.bubs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bub{min-width:92px;min-height:76px;padding:8px 18px;border:0;border-radius:20px;background:var(--surface);box-shadow:0 0 0 3px var(--line),0 6px 0 3px var(--line);cursor:pointer;font:600 26px var(--font-display);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--spring),box-shadow .15s,background .2s;margin-bottom:6px}
.bub.txt{font:600 18px var(--font-display);min-height:58px}
.bub:hover:not(:disabled){transform:translateY(-3px)}
.bub:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 3px var(--line),0 1px 0 3px var(--line)}
.bub:disabled{cursor:default}
.bub.right{background:var(--mint-soft);box-shadow:0 0 0 3px var(--mint),0 6px 0 3px var(--mint);animation:pop .4s var(--spring)}
.bub.wrong{background:var(--coral-soft);box-shadow:0 0 0 3px var(--coral),0 2px 0 3px var(--coral);opacity:.75;animation:shake .4s}
.bub.knife{gap:8px;font-size:20px}
.bub.knife svg{width:22px;height:22px}
@keyframes pop{40%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px 24px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:all .3s var(--ease)}
.dots i.on{background:var(--btn)}
.dots i.cur{width:26px;border-radius:6px;background:var(--btn)}

/* recipe card */
.recipe{padding:28px 26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.recipe .kobi{width:96px;height:96px}
.rcard{background:var(--c5);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;position:relative}
.rcard .tag{font:700 14px var(--font-display);letter-spacing:.04em;color:var(--muted)}
.rcard h3{margin:0;font:700 24px/1.3 var(--font-display);text-wrap:balance}
.rcard ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.rcard li{counter-increment:s;display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 14px}
.rcard li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font:600 14px var(--font-display)}

/* game */
.gtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;flex-wrap:wrap}
.plates{display:flex;gap:6px}
.plate{width:30px;height:30px;border-radius:50%;background:var(--tray);box-shadow:inset 0 0 0 3px var(--line);display:grid;place-items:center;transition:all .3s var(--spring)}
.plate.cur{box-shadow:inset 0 0 0 3px var(--btn)}
.plate.done{background:var(--choc);box-shadow:inset 0 0 0 3px var(--choc-hi);transform:scale(1.05)}
.plate.done.ok::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--butter)}
.gcount{font:600 15px var(--font-display);color:var(--muted)}
.order{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:0 22px 18px}
.cust{width:76px;height:76px;animation:bob 3s ease-in-out infinite}
.cust svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-4px)}}
.order .speech{max-width:none}
.order .speech .who{font:700 15px var(--font-display);color:var(--muted);display:block}
.order .speech p{margin:0;font-size:19px}
.order.happy .cust{animation:hop .6s var(--spring)}
@keyframes hop{40%{transform:translateY(-14px) rotate(-6deg)}}
.work{padding:22px 22px 8px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stepq{font:600 19px var(--font-display);text-align:center;margin:0;text-wrap:balance}
.kline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:4px 22px 0;padding:12px 14px;border-radius:20px;background:var(--tip-soft);animation:roll .35s var(--ease)}
.kline.ok{background:var(--mint-soft)}
.kline.bad{background:var(--coral-soft)}
.kline .kobi{width:52px;height:52px}
.kb{margin:0;font-size:17px}
.gact{display:flex;justify-content:space-between;gap:10px;padding:16px 22px 22px;flex-wrap:wrap}

/* cutter */
.cutter{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stepper{display:flex;align-items:center;gap:10px;background:var(--tray);padding:6px;border-radius:18px}
.stepper button{width:46px;height:46px;border-radius:14px;border:0;background:var(--surface);box-shadow:0 4px 0 var(--line);font:700 26px var(--font-display);cursor:pointer}
.stepper button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stepper .kn{min-width:44px;text-align:center;font:700 28px var(--font-display)}
.stepper .lbl{padding-inline:6px 10px;color:var(--muted);font-weight:600}
.tapbar{display:flex;gap:4px;width:100%;height:70px;padding:5px;background:var(--surface);border-radius:16px;box-shadow:0 0 0 2px var(--foil-edge),0 5px 0 2px var(--foil-edge)}

<script>
document.documentElement.lang = 'he';
document.documentElement.dir = 'rtl';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- math + markup helpers ---------- */
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a * b / gcd(a, b);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function coprime(d, lo = 1) { let n, guard = 0; do { n = ri(lo, d - 1); } while (gcd(n, d) !== 1 && guard++ < 50); return n; }

const fr = (n, d) => `<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
const mx = (w, n, d) => `<span class="mx"><span class="num">${w}</span>${fr(n, d)}</span>`;
const N = s => `<span class="num">${s}</span>`;
const OP = { plus: '<span class="op">+</span>', minus: '<span class="op">−</span>', times: '<span class="op">×</span>', eq: '<span class="op">=</span>', neq: '<span class="op">≠</span>', gt: '<span class="op">&gt;</span>', lt: '<span class="op">&lt;</span>' };
const KK = (s, k) => `<span class="kk"><span>${s}${k}</span><span>${s}${k}</span></span>`;
const E = (...p) => `<span class="eqline">${p.map(x => typeof x === 'number' || (typeof x === 'string' && x[0] !== '<' && x !== '{box}') ? N(x) : x).join('')}</span>`;
const M = s => `<span class="m">${s}</span>`;
function nice(n, d) { const g = gcd(n, d); n /= g; d /= g; if (d === 1) return N(n); if (n > d) return mx(Math.floor(n / d), n % d, d); return fr(n, d); }

/* scene builders */
const F = (id, from, to, tone = 'a') => ({ id, from, to, tone });
const B = (id, parts, fills = [], label = '', o = {}) => ({ id, parts, fills, label, ...o });
const pieces = (pre, start, count, d, tone = 'a') => Array.from({ length: count }, (_, i) => F(pre + i, (start + i) / d, (start + i + 1) / d, tone));
const AREA = (cols, colShade, rows = 1, rowShade = 0, overlap = false) => ({ area: { cols, colShade, rows, rowShade, overlap } });

/* k × n/d : k groups fly into whole bars */
function mulWhole(k, n, d) {
  const tones = ['a', 'b'];
  const groups = Array.from({ length: k }, (_, g) => B('g' + g, d, pieces('p' + g + '_', 0, n, d, tones[g % 2]), fr(n, d), { size: 'sm' }));
  const total = k * n, nb = Math.ceil(total / d), res = [];
  for (let r = 0; r < nb; r++) {
    const fills = [];
    for (let t = r * d; t < Math.min(total, (r + 1) * d); t++) {
      const g = Math.floor(t / n), j = t % n;
      fills.push(F('p' + g + '_' + j, (t % d) / d, (t % d + 1) / d, tones[g % 2]));
    }
    const c = Math.min(d, total - r * d);
    res.push(B('r' + r, d, fills, c === d ? N(1) : fr(c, d)));
  }
  return { before: { bars: groups }, after: { bars: res } };
}

/* a/b + c/d : recut to a common denominator, then pour the second into the first */
function sumScenes(a, b, c, d) {
  const L = lcm(b, d), A = a * L / b, C = c * L / d, over = A + C > L;
  const ySplit = (scale) => over ? [F('yc', 0, (L - A) / L, 'b'), F('yc2', (L - A) / L, C / L, 'b')] : [F('yc', 0, C / L, 'b')];
  const s0 = { bars: [B('X', b, [F('xa', 0, a / b)], fr(a, b)), B('Y', d, ySplit(), fr(c, d))] };
  const s1 = { bars: [B('X', L, [F('xa', 0, A / L)], fr(A, L)), B('Y', L, ySplit(), fr(C, L))] };
  const merged = [B('X', L, [F('xa', 0, A / L), F('yc', A / L, Math.min(1, (A + C) / L), 'b')], over ? N(1) : fr(A + C, L))];
  if (over) merged.push(B('Z', L, [F('yc2', 0, (A + C - L) / L, 'b')], fr(A + C - L, L)));
  const s2 = { bars: merged };
  return { s0, s1, s2, L, A, C, same: b === d };
}

/* ---------- Stage: renders a declarative scene and animates between scenes ---------- */
class Stage {
  constructor(el, mini) {
    this.el = el; el.classList.add('stage'); if (mini) el.classList.add('mini');
    el.innerHTML = '<div class="bars"></div><div class="area" hidden><div class="colf"></div><div class="rowf"></div><div class="ovl"></div></div>';
    this.barsEl = el.querySelector('.bars'); this.areaEl = el.querySelector('.area');
    this.bars = new Map(); this.fills = new Map(); this.acuts = { v: new Map(), h: new Map() }; this.pend = [];
  }
  syncCuts(map, host, parts, dir, still) {
    const want = new Map();
    for (let k = 1; k < parts; k++) { const g = gcd(k, parts); want.set(k / g + '/' + parts / g, k / parts); }
    for (const [key, el] of map) if (!want.has(key)) { el.classList.add('gone'); setTimeout(() => el.remove(), still ? 0 : 350); map.delete(key); }
    let i = 0;
    for (const [key, pos] of want) {
      if (map.has(key)) continue;
      const el = document.createElement('div'); el.className = dir === 'v' ? 'cut' : 'hcut';
      if (dir === 'v') el.style.right = pos * 100 + '%'; else el.style.top = pos * 100 + '%';
      if (!still) { el.classList.add('in'); el.style.transitionDelay = (i++ * 40) + 'ms'; this.pend.push(el); }
      host.appendChild(el); map.set(key, el);
    }
  }
  static setFill(el, f, parts) {
    const k = Math.max(1, Math.round((f.to - f.from) * parts)); el.style.backgroundSize = (100 / k) + "% 100%";
    el.className = 'fill ' + f.tone + (f.from <= 0 ? ' s' : '') + (f.to >= 1 ? ' e' : '');
    el.style.right = f.from * 100 + '%'; el.style.width = (f.to - f.from) * 100 + '%';
  }
  render(scene, opts = {}) {
    const still = !!opts.instant || REDUCE.matches;
    this.el.classList.toggle('still', still);
    const bars = scene.bars || [];
    const hostRect = this.barsEl.getBoundingClientRect();
    const oldFill = new Map(), oldRow = new Map();
    for (const [id, f] of this.fills) oldFill.set(id, f.el.getBoundingClientRect());
    for (const [id, r] of this.bars) oldRow.set(id, r.row.getBoundingClientRect());
    const wantBars = new Set(bars.map(b => b.id));
    const wantFills = new Set(); bars.forEach(b => b.fills.forEach(f => wantFills.add(f.id)));

    for (const [id, f] of this.fills) if (!wantFills.has(id)) { f.el.classList.add('gone'); const el = f.el; setTimeout(() => el.remove(), still ? 0 : 400); this.fills.delete(id); }
    for (const [id, r] of this.bars) if (!wantBars.has(id)) {
      const o = oldRow.get(id), el = r.row;
      el.style.cssText = `position:absolute;top:${o.top - hostRect.top}px;left:${o.left - hostRect.left}px;width:${o.width}px`;
      el.classList.add('leave'); setTimeout(() => el.remove(), still ? 0 : 450); this.bars.delete(id);
    }

    const entered = [], moved = [], grown = [];
    for (const b of bars) {
      let r = this.bars.get(b.id), isNew = false;
      if (!r) {
        const row = document.createElement('div');
        row.innerHTML = '<div class="blabel" dir="ltr"></div><div class="track"></div>';
        r = { row, label: row.firstChild, track: row.lastChild, cuts: new Map(), lh: null };
        this.bars.set(b.id, r); isNew = true;
      }
      this.barsEl.appendChild(r.row);
      r.row.className = 'brow' + (b.size ? ' ' + b.size : '') + (b.dim ? ' dim' : '') + (b.mark ? ' mark-' + b.mark : '');
      if (isNew && !still) { r.row.classList.add('enter'); entered.push(r.row); }
      const lh = b.label || '';
      if (r.lh !== lh) { r.label.innerHTML = lh; r.lh = lh; if (!isNew && !still) { r.label.classList.remove('roll'); void r.label.offsetWidth; r.label.classList.add('roll'); } }
      this.syncCuts(r.cuts, r.track, b.parts, 'v', still);
      for (const f of b.fills) {
        let rec = this.fills.get(f.id), flyFrom = null;
        if (rec && rec.bar !== b.id) { flyFrom = oldFill.get(f.id); rec.el.remove(); this.fills.delete(f.id); rec = null; }
        if (rec) { Stage.setFill(rec.el, f, b.parts); continue; }
        const el = document.createElement('div'); r.track.appendChild(el);
        this.fills.set(f.id, { el, bar: b.id });
        if (flyFrom) { Stage.setFill(el, f, b.parts); moved.push({ el, from: flyFrom, row: r.row }); }
        else if (still) Stage.setFill(el, f, b.parts);
        else { Stage.setFill(el, f, b.parts); el.style.width = '0%'; grown.push({ el, f }); }
      }
    }

    // area model
    const ar = scene.area, wasHidden = this.areaEl.hidden, later = [];
    if (ar) {
      this.areaEl.hidden = false;
      this.syncCuts(this.acuts.v, this.areaEl, ar.cols, 'v', still);
      this.syncCuts(this.acuts.h, this.areaEl, ar.rows, 'h', still);
      const set = () => {
        const [c, rf, ov] = this.areaEl.children;
        c.style.width = ar.colShade / ar.cols * 100 + '%';
        rf.style.height = ar.rowShade / ar.rows * 100 + '%';
        ov.style.width = c.style.width; ov.style.height = rf.style.height;
        this.areaEl.classList.toggle('ov', !!ar.overlap);
      };
      if (wasHidden && !still) later.push(set); else set();
    } else if (!wasHidden) {
      this.areaEl.hidden = true;
      for (const m of [this.acuts.v, this.acuts.h]) { for (const el of m.values()) el.remove(); m.clear(); }
      const [c, rf, ov] = this.areaEl.children; c.style.width = rf.style.height = ov.style.width = ov.style.height = '0';
      this.areaEl.classList.remove('ov');
    }

    if (still) { this.pend = []; return; }
    // FLIP: rows that shifted, and pieces that flew from one bar to another
    const rowDy = new Map();
    for (const [id, r] of this.bars) {
      if (!oldRow.has(id) || entered.includes(r.row)) continue;
      const dy = oldRow.get(id).top - r.row.getBoundingClientRect().top;
      if (Math.abs(dy) > .5) rowDy.set(r.row, dy);
    }
    const flights = moved.map(m => {
      const nr = m.el.getBoundingClientRect();
      return { el: m.el, dx: m.from.left - nr.left, dy: m.from.top - nr.top - (rowDy.get(m.row) || 0), sx: m.from.width / Math.max(1, nr.width), sy: m.from.height / Math.max(1, nr.height) };
    });
    for (const [row, dy] of rowDy) { row.style.transition = 'none'; row.style.transform = `translateY(${dy}px)`; }
    for (const f of flights) { f.el.style.transition = 'none'; f.el.style.transformOrigin = '0 0'; f.el.style.zIndex = 5; f.el.style.transform = `translate(${f.dx}px,${f.dy}px) scale(${f.sx},${f.sy})`; }
    void this.el.offsetWidth;
    for (const [row] of rowDy) { row.style.transition = ''; row.style.transform = ''; }
    flights.forEach((f, i) => { f.el.style.transition = ''; f.el.style.transitionDelay = (i * 90) + 'ms'; f.el.style.transform = ''; setTimeout(() => { f.el.style.zIndex = ''; f.el.style.transitionDelay = ''; }, 900 + i * 90); });
    grown.forEach(({ el, f }, i) => { el.style.transitionDelay = (120 + i * 60) + 'ms'; el.style.width = (f.to - f.from) * 100 + '%'; });
    entered.forEach(r => r.classList.remove('enter'));
    this.pend.forEach(el => el.classList.remove('in')); this.pend = [];
    later.forEach(fn => fn());
  }
}

const LESSONS = {
  1: [
    { scene: { bars: [B('w', 1, [], N(1))] }, eq: E(1), say: 'זה <b>שלם אחד</b>: חפיסת שוקולד שלמה. עוד לא חתכנו אותה.' },
    { scene: { bars: [B('w', 4, [], fr('?', 4))] }, eq: E(fr('?', '<mark>4</mark>')), say: 'חותכים את החפיסה ל־<b>4 חלקים שווים</b>. המספר שמתחת לקו נקרא <b>מכנה</b>: הוא אומר לכמה חלקים חתכנו את השלם.' },
    { ask: { q: 'אכלנו 3 חלקים. איזה שבר מהחפיסה אכלנו?', options: [fr(3, 4), fr(4, 3), fr(1, 3)], correct: 0, right: '3 חלקים מתוך 4.', wrong: `המכנה הוא מספר כל החלקים (4), והמונה סופר כמה לקחנו (3). התשובה: ${fr(3, 4)}.` },
      scene: { bars: [B('w', 4, [F('w1', 0, 3 / 4)], fr(3, 4))] }, eq: E(fr('<mark>3</mark>', 4)), say: 'המספר שמעל הקו נקרא <b>מונה</b>: הוא סופר כמה חלקים לקחנו. 3 חלקים מתוך 4 הם <b>שלושה רבעים</b>.' },
    { ask: { q: 'מי גדול יותר: רבע או שמינית?', options: [fr(1, 4), fr(1, 8), 'שווים'], correct: 0, right: 'רבע גדול יותר.', wrong: 'דווקא רבע גדול יותר. את השמיניות חתכנו מאותו שלם ליותר חלקים, אז כל אחת קטנה יותר.' },
      pre: { scene: { bars: [B('q4', 4, [], fr(1, 4)), B('q8', 8, [], fr(1, 8))] }, eq: E(fr(1, 4), '?', fr(1, 8)) },
      scene: { bars: [B('q2', 2, [F('h2', 0, 1 / 2)], fr(1, 2)), B('q4', 4, [F('h4', 0, 1 / 4)], fr(1, 4)), B('q8', 8, [F('h8', 0, 1 / 8)], fr(1, 8))] },
      eq: E(fr(1, 2), OP.gt, fr(1, 4), OP.gt, fr(1, 8)), say: 'ככל שהמכנה <b>גדול</b> יותר, כל חלק <b>קטן</b> יותר: חתכנו את אותו שלם ליותר חתיכות.' },
    { scene: { bars: [B('w', 4, [F('w1', 0, 1)], fr(4, 4))] }, eq: E(fr(4, 4), OP.eq, 1), say: 'כשלוקחים את כל החלקים, המונה שווה למכנה. זה בדיוק שלם אחד.' }
  ],
  2: [
    { scene: { bars: [B('e', 2, [F('e1', 0, 1 / 2)], fr(1, 2))] }, eq: E(fr(1, 2)), say: 'חצי חפיסה צבוע: חלק אחד מתוך 2.' },
    { scene: { bars: [B('e', 4, [F('e1', 0, 1 / 2)], fr(2, 4))] }, eq: E(fr(1, 2), KK('×', 2), OP.eq, fr(2, 4)), say: 'חותכים <b>כל</b> חלק לשניים. השטח הצבוע לא זז, הוא רק נחתך לחתיכות קטנות יותר. עכשיו יש 4 חלקים, ו־2 מהם צבועים.' },

}
function tick() {
  const c = fx.getContext('2d'), dpr = devicePixelRatio || 1; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight + 40);

function fopts(ans, cands) {

    if (out.length >= 3) break;
    if (!(d > 0) || n < 0 || !Number.isInteger(n) || !Number.isInteger(d)) continue;
    if (out.some(o => eqv(o.f, [n, d]))) continue;

/* ---------- lesson ---------- */

        (a !== undefined ? `<p class="prose" style="margin:0">${a === s.ask.correct ? '<b>ניחשתם נכון!</b> ' + s.ask.right : '<b>יפה שניחשתם.</b> ' + s.ask.wrong}</p>` : '');

/* ---------- game ---------- */
function drawGame(root, st) {
  const gens = ORDERS[st], LEN = 6;
  const plan = [0, ...shuffle(Array.from({ length: LEN - 1 }, (_, k) => (k + 1) % gens.length))];
  const results = []; let oi = 0;
  function drawOrder() {
    const o = gens[plan[oi]](); const who = { name: pick(NAMES), seed: ri(0, 1 << 14) };
    let step = 0, stepMist = 0, mist = 0, usedHint = false;
    root.innerHTML = `
      <div class="gtop"><div class="plates" aria-label="הזמנות">${Array.from({ length: LEN }, (_, k) => `<span class="plate${k < oi ? ' done' + (results[k] ? ' ok' : '') : k === oi ? ' cur' : ''}"></span>`).join('')}</div><span class="gcount">הזמנה ${oi + 1} מתוך ${LEN}</span></div>
      <div class="order"><div class="cust">${avatar(who.seed)}</div><div class="speech"><span class="who">${who.name} מזמינים:</span><p id="osay">${o.say}</p></div></div>
      <div class="stage-host" ${o.scene ? '' : 'hidden'}></div>
      <div class="work"><p class="stepq" id="stepq"></p><div id="area" style="width:100%;display:flex;justify-content:center"></div></div>
      <div id="kl"></div>
      <div class="gact"><button class="tbtn ghost sm" id="hintBtn">רמז מקובי</button><button class="tbtn" id="go" hidden></button></div>`;
    const host = $('.stage-host', root), stage = new Stage(host, true);
    if (o.scene) stage.render(o.scene);
    const area = $('#area', root), go = $('#go', root), hintBtn = $('#hintBtn', root);
    const say = (mood, cls, html) => { $('#kl', root).innerHTML = `<div class="kline ${cls}">${kobi(mood)}<p class="kb">${html}</p></div>`; };
    if (oi === 0) { say('happy', '', `<b>טיפ להזמנה הראשונה:</b> ${o.hint}`); hintBtn.hidden = true; }
    hintBtn.onclick = () => { usedHint = true; sfx.tap(); say('think', '', `<b>רמז:</b> ${o.hint}`); hintBtn.hidden = true; };

    function stepDone(s) {
      if (s.then) { host.hidden = false; stage.render(s.then); }
      step++; stepMist = 0;
      if (step < o.steps.length) setTimeout(drawStep, REDUCE.matches ? 0 : 750);
      else setTimeout(orderDone, REDUCE.matches ? 0 : 450);
    }
    function wrong(why, el) {
      mist++; stepMist++; sfx.bad();
      if (el) { el.classList.add('wrong'); el.disabled = true; }
      say('think', 'bad', why || 'כמעט! נסו שוב.');
    }
    function orderDone() {
      const perfect = mist === 0 && !usedHint; results[oi] = perfect;
      sfx.win(); confetti(...centerOf($('.cust', root)), perfect ? 80 : 40);
      $('.order', root).classList.add('happy');
      $('#osay', root).innerHTML = pick(['תודה רבה! בדיוק מה שרציתי.', 'מושלם, תודה!', 'וואו, איזה יופי. תודה!']);
      say('wow', 'ok', `${perfect ? '<b>מושלם! 3 מטבעות.</b> ' : '<b>הזמנה הוגשה! מטבע אחד.</b> '}${o.explain}`);
      addCoins(perfect ? 3 : 1, $('.cust', root));
      hintBtn.hidden = true;
      const pl = root.querySelectorAll('.plate')[oi]; pl.className = 'plate done' + (perfect ? ' ok' : '');
      go.hidden = false; go.textContent = oi === LEN - 1 ? 'לסיכום ←' : 'הזמנה הבאה ←';
      go.onclick = () => { sfx.tap(); oi++; oi < LEN ? drawOrder() : levelEnd(); };
      go.focus({ preventScroll: true });
    }
    function drawStep() {
      const s = o.steps[step];

      if (s.kind === 'pick') {
        area.innerHTML = `<div class="bubs">${s.opts.map((op, k) => `<button class="bub${s.style === 'knife' ? ' knife' : ''}" data-k="${k}">${op.h}</button>`).join('')}</div>`;

            stepDone(s);
          } else {
            wrong(op.why, b);

    function drawCutter(s) {

          <div class="stepper"><button data-d="-1" aria-label="פחות חלקים">−</button><span class="kn">${partsN}</span><button data-d="1" aria-label="יותר חלקים">+</button><span class="lbl">${partsN === 1 ? 'חפיסה שלמה' : 'חלקים שווים'}</span></div>
          <div class="tapbar" dir="rtl">${Array.from({ length: partsN }, (_, k) => `<button data-p="${k}" aria-pressed="${taken.has(k)}" aria-label="חלק ${k + 1}"></button>`).join('')}</div>
          <span class="takeinfo">${partsN > 1 ? `לקחתם ${taken.size} מתוך ${partsN} חלקים` : 'קודם חותכים: לחצו על +'}</span>

      area.onclick = e => {
        const d = e.target.closest('[data-d]'), p = e.target.closest('[data-p]'), sv = e.target.closest('[data-serve]');
        if (d) { const nv = Math.min(12, Math.max(1, partsN + +d.dataset.d)); if (nv !== partsN) { partsN = nv; taken.clear(); sfx.cut(); paint(); } }
        else if (p) { const k = +p.dataset.p; taken.has(k) ? taken.delete(k) : taken.add(k); sfx.tap(); p.setAttribute('aria-pressed', taken.has(k)); area.querySelector('.takeinfo').textContent = `לקחתם ${taken.size} מתוך ${partsN} חלקים`; }
        else if (sv) {
          if (partsN < 2) return say('think', '', 'קודם חותכים את החפיסה: לחצו על + כדי לבחור לכמה חלקים.');
          if (!taken.size) return say('think', '', 'לחצו על חלקים כדי לקחת אותם להזמנה.');
          if (eqv([taken.size, partsN], [s.n, s.d])) {
            sfx.ok(); area.querySelectorAll('button').forEach(x => x.disabled = true);
            if (partsN !== s.d) say('wow', 'ok', `חכם! ${M(fr(taken.size, partsN) + ' = ' + fr(s.n, s.d))}, אותה כמות.`);
            stepDone(s);
          } else {
            const why = partsN !== s.d && !(partsN % s.d === 0) ? `המכנה הוא ${s.d}: חותכים ל־${s.d} חלקים שווים.` : taken.size === partsN - s.n * partsN / s.d ? 'לקחתם את מה שצריך להישאר. המונה אומר כמה <b>לקחת</b>.' : `ספרו: צריך ${s.n} חלקים מתוך ${s.d}.`;
            wrong(why, null);
            if (stepMist >= 2) { partsN = s.d; taken.clear(); for (let k = 0; k < s.n; k++) taken.add(k); paint(); area.querySelectorAll('button').forEach(x => x.disabled = true); say('happy', '', `כך: חותכים ל־${s.d} ולוקחים ${s.n}.`); go.hidden = false; go.textContent = 'הבנתי, ממשיכים ←'; go.onclick = () => { go.hidden = true; stepDone(s); }; }
          }
        }
      };
    }
    function drawMemory(s) {
      let open = [], got = 0, misses = 0, lock = false;
      area.innerHTML = `<div class="mem">${s.cards.map((c, k) => `<button class="mcard" data-m="${k}" aria-label="קלף ${k + 1}"><span class="in"><span class="f">${kobi('happy')}</span><span class="b">${c.h}</span></span></button>`).join('')}</div>`;
      area.onclick = e => {
        const b = e.target.closest('[data-m]'); if (!b || lock || b.classList.contains('up') || b.classList.contains('got')) return;
        sfx.tap(); b.classList.add('up'); open.push(b);
        if (open.length < 2) return;
        const [x, y] = open; open = [];
        if (s.cards[+x.dataset.m].id === s.cards[+y.dataset.m].id) {
          setTimeout(() => { x.classList.add('got'); y.classList.add('got'); sfx.ok(); got++; if (got === s.cards.length / 2) { mist = misses > 4 ? 1 : 0; stepDone(s); } }, 350);
        } else {
          misses++; lock = true; setTimeout(() => { x.classList.remove('up'); y.classList.remove('up'); lock = false; }, 1000);
          if (misses === 3) say('think', '', 'טיפ: חפשו קלף עם ציור, ובדקו איזה חלק מהחפיסה צבוע.');
        }
      };
    }
    drawStep();
  }
  function levelEnd() {
    const good = results.filter(Boolean).length, stars = good >= 5 ? 3 : good >= 3 ? 2 : 1;
    const prev = S.stars[st] || 0; if (stars > prev) { S.stars[st] = stars; save(); hud(); }
    const ov = document.createElement('div'); ov.className = 'over';
    ov.innerHTML = `${kobi(stars === 3 ? 'wow' : 'happy')}<div class="bigstars">${[1, 2, 3].map(i => star(i <= stars)).join('')}</div>
      <h3>${stars === 3 ? 'שף שברים!' : stars === 2 ? 'עבודה טובה!' : 'סיימתם סבב!'}</h3>
      <p>${good} מתוך ${LEN} הזמנות היו מושלמות. ${stars < 3 ? 'הזמנה מושלמת היא בלי טעות ובלי רמז. רוצים לנסות לשלושה כוכבים?' : 'כל הכבוד!'}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="tbtn" id="again">עוד סבב</button>${st < 5 ? `<a class="tbtn sun" href="#s${st + 1}" style="text-decoration:none">לתחנה ${st + 1} ←</a>` : '<a class="tbtn sun" href="#race" style="text-decoration:none">למרוץ ←</a>'}<a class="tbtn ghost" href="#home" style="text-decoration:none">למפה</a></div>`;
    ov.querySelector('.kobi').style.cssText = 'width:110px;height:110px';
    root.appendChild(ov); sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 120);
    ov.querySelector('#again').onclick = () => drawGame(root, st);
  }
  drawOrder();
}

/* ---------- race ---------- */
const RACE = [
  () => { const d = ri(3, 10), a = ri(1, d - 2), c = ri(1, d - 1 - a); return { eq: E(fr(a, d), OP.plus, fr(c, d), OP.eq, '?'), opts: fopts([a + c, d], [[a + c, 2 * d], [a * c, d]]) }; },
  () => { const d = ri(3, 12), n = ri(1, d - 1); return { eq: E(1, OP.minus, fr(n, d), OP.eq, '?'), opts: fopts([d - n, d], [[n, d], [d - n, n]]) }; },
  () => { const d = ri(3, 9), n = ri(1, 3), k = ri(2, 4); return { eq: E(k, OP.times, fr(n, d), OP.eq, '?'), opts: fopts([k * n, d], [[k * n, k * d], [k + n, d]]) }; },
  () => { const d1 = ri(2, 4), n1 = ri(1, d1 - 1), d2 = ri(2, 5), n2 = ri(1, d2 - 1); return { eq: E(fr(n1, d1), OP.times, fr(n2, d2), OP.eq, '?'), opts: fopts([n1 * n2, d1 * d2], [[n1 + n2, d1 + d2], [n1 * n2, d2]]) }; },
  () => { const d = ri(2, 6), n = coprime(d), k = ri(2, 4); return { q: 'הכי מצומצם:', eq: E(fr(n * k, d * k), OP.eq, '?'), opts: fopts([n, d], [[n, d * k], [n * k, d]]) }; },
  () => { const [p, q] = pick([[2, 4], [2, 6], [3, 6], [2, 3], [2, 5], [3, 4]]), a = ri(1, p - 1), c = ri(1, q - 1), L = lcm(p, q); return { eq: E(fr(a, p), OP.plus, fr(c, q), OP.eq, '?'), opts: fopts([a * L / p + c * L / q, L], [[a + c, p + q], [a + c, L]]) }; },
  () => { let a = ri(2, 9), b; do { b = ri(2, 9); } while (b === a); return { q: 'מה גדול יותר?', eq: '', opts: [{ h: fr(1, a), ok: a < b }, { h: fr(1, b), ok: b < a }] }; },
  () => { const d = ri(2, 5), n = ri(1, d - 1), k = ri(2, 4); return { eq: E(fr(n, d), OP.eq, fr('?', d * k)), opts: shuffle([n * k, n + (d * k - d), n * k + 1].filter((v, i, a) => a.indexOf(v) === i).map(v => ({ h: N(v), ok: v === n * k }))) }; }
];
function drawRace() {
  view.innerHTML = `<div class="shead"><div class="ttl"><span class="num" style="background:var(--c6)">★</span><div><h2>מרוץ השברים</h2><p>60 שניות, כל הנושאים. רצף תשובות נכונות מכפיל נקודות.</p></div></div></div><section class="panel" id="panel"></section>`;
  const root = $('#panel');
  root.innerHTML = `<div class="race" style="justify-content:center">${kobi('wow').replace('class="kobi"', 'class="kobi" style="width:120px;height:120px"')}
    <p class="stepq">שיא אישי: ${S.race} נקודות</p><button class="tbtn sun" id="start">מתחילים!</button></div>`;
  $('#start', root).onclick = start;
  function start() {
    sfx.ok(); let t = 60, score = 0, combo = 0, lock = false, q, correct = 0;
    root.innerHTML = `<div class="race"><div class="rtop"><span>${COIN.replace('<svg', '<svg style="width:22px;height:22px;vertical-align:-4px"')} <span id="sc">0</span></span><div class="timer"><i id="tb" style="width:100%"></i></div><span><span id="tt">60</span> שנ׳</span></div>
      <span class="combo" id="cb" style="font:600 18px var(--font-display);min-height:1.5em"></span><div class="rq" id="rq" dir="ltr"></div><div class="bubs" id="rb"></div></div>`;
    const timer = setInterval(() => { t--; $('#tt', root) && ($('#tt', root).textContent = t); const tb = $('#tb', root); if (tb) tb.style.width = (t / 60 * 100) + '%'; if (t <= 0) { clearInterval(timer); end(); } }, 1000);
    window.addEventListener('hashchange', () => clearInterval(timer), { once: true });
    function nextQ() { q = pick(RACE)(); lock = false; $('#rq', root).innerHTML = `${q.q ? `<span class="qline" dir="rtl">${q.q}</span>` : ''}${q.eq}`; $('#rb', root).innerHTML = q.opts.map((o, k) => `<button class="bub" data-r="${k}">${o.h}</button>`).join(''); }
    root.onclick = e => {
      const b = e.target.closest('[data-r]'); if (!b || lock) return; lock = true;
      const o = q.opts[+b.dataset.r];
      if (o.ok) { combo++; correct++; const pts = 10 * Math.min(4, 1 + Math.floor(combo / 3)); score += pts; sfx.ok(); b.classList.add('right'); floaty(b, '+' + pts); if (combo % 3 === 0) confetti(...centerOf(b), 30); setTimeout(nextQ, 350); }
      else { combo = 0; sfx.bad(); b.classList.add('wrong'); $('#rb', root).querySelectorAll('[data-r]').forEach(x => { if (q.opts[+x.dataset.r].ok) x.classList.add('right'); }); setTimeout(nextQ, 1100); }
      $('#sc', root).textContent = score; $('#cb', root).textContent = combo >= 3 ? `רצף ${combo}! נקודות ×${Math.min(4, 1 + Math.floor(combo / 3))}` : '';
    };
    function end() {
      const best = score > S.race; if (best) { S.race = score; save(); }
      const coins = Math.floor(correct / 3);
      root.innerHTML = `<div class="race" style="justify-content:center">${kobi(best ? 'wow' : 'happy').replace('class="kobi"', 'class="kobi" style="width:110px;height:110px"')}<h3 style="margin:0;font:700 34px var(--font-display)">${score} נקודות</h3>
        <p class="stepq">${best ? 'שיא חדש!' : `השיא שלכם: ${S.race}`} · ${correct} תשובות נכונות · ${coins} מטבעות</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="tbtn sun" id="start">עוד מרוץ</button><a class="tbtn ghost" href="#home" style="text-decoration:none">למפה</a></div></div>`;
      $('#start', root).onclick = start; sfx.win(); if (best) confetti(innerWidth / 2, innerHeight / 3, 120);
      if (coins) addCoins(coins, $('.race h3', root));
    }
    nextQ();
  }
}
